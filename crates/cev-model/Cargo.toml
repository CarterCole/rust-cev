[package]
name = "cev-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Neural backend for cev (Calibrated Enum Verdicts): a prefill-only Qwen3 decoder in candle that reads typed answers from option-code logits."
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dependencies]
cev-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
web-time.workspace = true
rayon = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["onig"] }
ureq = "3"

# In the browser: pure-Rust regex, and weights arrive as fetched bytes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { workspace = true, features = ["unstable_wasm"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
half = "2"
